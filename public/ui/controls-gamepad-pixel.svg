<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 156" width="320" height="156" shape-rendering="crispEdges">
  <!-- 1979 16-Bit Pixel-Art Diagram Frame -->
  <rect x="2" y="0" width="316" height="156" fill="#10080a"/>
  <rect x="0" y="2" width="320" height="152" fill="#10080a"/>
  <rect x="2" y="2" width="316" height="152" fill="#5c3622"/>
  <rect x="4" y="4" width="312" height="2" fill="#8a5232"/>
  <rect x="4" y="150" width="312" height="2" fill="#2e180e"/>
  <rect x="6" y="6" width="308" height="144" fill="#160c14"/>
  <!-- 1979 Sunset Trim -->
  <rect x="6" y="6" width="308" height="2" fill="#a6ff38"/>
  <rect x="6" y="8" width="308" height="2" fill="#ff6cb5"/>
  <rect x="6" y="10" width="308" height="2" fill="#ff7f2a"/>
  <!-- Corner Rivets -->
  <rect x="4" y="4" width="2" height="2" fill="#ffdf9e"/>
  <rect x="314" y="4" width="2" height="2" fill="#ffdf9e"/>
  <rect x="4" y="150" width="2" height="2" fill="#ffdf9e"/>
  <rect x="314" y="150" width="2" height="2" fill="#ffdf9e"/>

  <!-- Header -->
  <text x="160" y="23" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="7.5" fill="#ff7f2a" letter-spacing="1">GAMEPAD CONTROLS</text>

  <!-- ========================================================= -->
  <!-- ACTUAL 16-BIT PIXEL-ART RETRO GAMEPAD (Center: x=92..228, y=42..126) -->
  <!-- ========================================================= -->
  <!-- Shoulder Triggers LT / RT -->
  <rect x="108" y="40" width="24" height="8" fill="#10080a"/>
  <rect x="110" y="42" width="20" height="6" fill="#ffdf9e"/>
  <rect x="188" y="40" width="24" height="8" fill="#10080a"/>
  <rect x="190" y="42" width="20" height="6" fill="#ff7f2a"/>

  <!-- Main Controller Body Silhouette (16-bit stepped pixel silhouette) -->
  <!-- Dark Ink Outline -->
  <rect x="102" y="46" width="116" height="48" fill="#090407"/>
  <rect x="96" y="52" width="128" height="44" fill="#090407"/>
  <rect x="92" y="60" width="136" height="36" fill="#090407"/>
  <!-- Left & Right Ergonomic Grips Outline -->
  <rect x="90" y="84" width="34" height="30" fill="#090407"/>
  <rect x="94" y="110" width="24" height="12" fill="#090407"/>
  <rect x="196" y="84" width="34" height="30" fill="#090407"/>
  <rect x="202" y="110" width="24" height="12" fill="#090407"/>

  <!-- Retro Brown / Warm Charcoal Controller Shell -->
  <rect x="104" y="48" width="112" height="44" fill="#6b3e26"/>
  <rect x="98" y="54" width="124" height="38" fill="#6b3e26"/>
  <rect x="94" y="62" width="132" height="30" fill="#6b3e26"/>
  <!-- Top Bevel Highlight -->
  <rect x="106" y="48" width="108" height="3" fill="#9e623f"/>
  <!-- Grips Fill -->
  <rect x="92" y="84" width="30" height="28" fill="#522d1a"/>
  <rect x="96" y="108" width="20" height="12" fill="#3e2012"/>
  <rect x="198" y="84" width="30" height="28" fill="#522d1a"/>
  <rect x="204" y="108" width="20" height="12" fill="#3e2012"/>
  <!-- Center Faceplate Recess -->
  <rect x="142" y="54" width="36" height="30" fill="#2c1810"/>
  <!-- 1979 Center Emblem Stripe -->
  <rect x="148" y="60" width="24" height="2" fill="#ff7f2a"/>
  <rect x="148" y="62" width="24" height="2" fill="#ff6cb5"/>
  <rect x="148" y="64" width="24" height="2" fill="#a6ff38"/>
  <!-- Start / Select Micro Pills -->
  <rect x="149" y="72" width="8" height="4" fill="#8a5232"/>
  <rect x="163" y="72" width="8" height="4" fill="#8a5232"/>

  <!-- LEFT ANALOG STICK (Orange Rim — MOVE) -->
  <rect x="106" y="58" width="18" height="18" fill="#10080a"/>
  <rect x="108" y="60" width="14" height="14" fill="#ff7f2a"/>
  <rect x="110" y="62" width="10" height="10" fill="#2a160c"/>
  <rect x="112" y="64" width="6" height="6" fill="#ff9e44"/>

  <!-- D-PAD (Pink Down Highlight — SLIDE/DUCK) -->
  <rect x="128" y="78" width="6" height="18" fill="#10080a"/>
  <rect x="122" y="84" width="18" height="6" fill="#10080a"/>
  <rect x="129" y="79" width="4" height="16" fill="#8a5232"/>
  <rect x="123" y="85" width="16" height="4" fill="#8a5232"/>
  <!-- D-Down Pink highlight -->
  <rect x="129" y="89" width="4" height="6" fill="#ff6cb5"/>

  <!-- RIGHT ANALOG STICK (Gold Rim — 360 AIM) -->
  <rect x="174" y="78" width="18" height="18" fill="#10080a"/>
  <rect x="176" y="80" width="14" height="14" fill="#ffdf9e"/>
  <rect x="178" y="82" width="10" height="10" fill="#2a1c0c"/>
  <rect x="180" y="84" width="6" height="6" fill="#ffdf9e"/>

  <!-- 4 DIAMOND FACE BUTTONS (Y, X, B, A) -->
  <!-- Y (Top — Lime Shield) -->
  <rect x="200" y="54" width="10" height="10" fill="#10080a"/>
  <rect x="201" y="55" width="8" height="8" fill="#a6ff38"/>
  <text x="205" y="61" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="4.8" fill="#102208">Y</text>
  <!-- X (Left — Pink Shoot) -->
  <rect x="190" y="64" width="10" height="10" fill="#10080a"/>
  <rect x="191" y="65" width="8" height="8" fill="#ff6cb5"/>
  <text x="195" y="71" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="4.8" fill="#2e081a">X</text>
  <!-- B (Right — Lime Shield) -->
  <rect x="210" y="64" width="10" height="10" fill="#10080a"/>
  <rect x="211" y="65" width="8" height="8" fill="#a6ff38"/>
  <text x="215" y="71" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="4.8" fill="#102208">B</text>
  <!-- A (Bottom — Bright Lime Jump 2X) -->
  <rect x="200" y="74" width="10" height="10" fill="#10080a"/>
  <rect x="201" y="75" width="8" height="8" fill="#a6ff38"/>
  <text x="205" y="81" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="4.8" fill="#102208">A</text>

  <!-- ========================================================= -->
  <!-- PIXEL-ART DIAGRAM CALLOUT LINES + LABELS                  -->
  <!-- ========================================================= -->

  <!-- 1. LB / LT -> SPRINT (Top-Left) -->
  <rect x="118" y="34" width="2" height="8" fill="#ffdf9e"/>
  <rect x="64" y="34" width="56" height="2" fill="#ffdf9e"/>
  <rect x="117" y="40" width="4" height="3" fill="#ffffff"/>
  <text x="60" y="38" text-anchor="end" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#ffdf9e">LB: SPRINT</text>

  <!-- 2. L-STICK -> MOVE (Mid-Left) -->
  <rect x="64" y="66" width="44" height="2" fill="#ff7f2a"/>
  <rect x="106" y="65" width="3" height="4" fill="#ffffff"/>
  <text x="60" y="70" text-anchor="end" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#ff9e44">MOVE</text>

  <!-- 3. D-DOWN -> SLIDE/DUCK (Bottom-Left) -->
  <rect x="130" y="95" width="2" height="36" fill="#ff6cb5"/>
  <rect x="68" y="129" width="64" height="2" fill="#ff6cb5"/>
  <rect x="129" y="93" width="4" height="3" fill="#ffffff"/>
  <text x="64" y="133" text-anchor="end" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#ff9ed0">SLIDE/DUCK</text>

  <!-- 4. RT / LT -> JETPACK (Top-Right) -->
  <rect x="200" y="34" width="2" height="8" fill="#ff7f2a"/>
  <rect x="200" y="34" width="42" height="2" fill="#ff7f2a"/>
  <rect x="199" y="40" width="4" height="3" fill="#ffffff"/>
  <text x="246" y="38" text-anchor="start" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#ff9e44">RT: JETPACK</text>

  <!-- 5. B / Y -> SHIELD (Upper-Right) -->
  <rect x="220" y="68" width="26" height="2" fill="#a6ff38"/>
  <rect x="219" y="67" width="3" height="4" fill="#ffffff"/>
  <text x="250" y="72" text-anchor="start" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#a6ff38">B/Y: SHIELD</text>

  <!-- 6. X / RB -> SHOOT (Mid-Right via short drop) -->
  <rect x="194" y="74" width="2" height="24" fill="#ff6cb5"/>
  <rect x="194" y="96" width="52" height="2" fill="#ff6cb5"/>
  <rect x="193" y="72" width="4" height="3" fill="#ffffff"/>
  <text x="250" y="100" text-anchor="start" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#ff6cb5">X: SHOOT</text>

  <!-- 7. A -> JUMP 2X (Lower-Right) -->
  <rect x="204" y="84" width="2" height="34" fill="#a6ff38"/>
  <rect x="204" y="116" width="42" height="2" fill="#a6ff38"/>
  <rect x="203" y="82" width="4" height="3" fill="#ffffff"/>
  <text x="250" y="120" text-anchor="start" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#a6ff38">A: JUMP 2X</text>

  <!-- 8. R-STICK -> 360 AIM (Bottom-Center-Right) -->
  <rect x="182" y="96" width="2" height="38" fill="#ffdf9e"/>
  <rect x="182" y="132" width="64" height="2" fill="#ffdf9e"/>
  <rect x="181" y="94" width="4" height="3" fill="#ffffff"/>
  <text x="250" y="136" text-anchor="start" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#ffdf9e">360 AIM</text>
</svg>
