<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 156" width="320" height="156" shape-rendering="crispEdges">
  <!-- 1979 16-Bit Pixel-Art Diagram Frame -->
  <rect x="2" y="0" width="316" height="156" fill="#10080a"/>
  <rect x="0" y="2" width="320" height="152" fill="#10080a"/>
  <rect x="2" y="2" width="316" height="152" fill="#5c3622"/>
  <rect x="4" y="4" width="312" height="2" fill="#8a5232"/>
  <rect x="4" y="150" width="312" height="2" fill="#2e180e"/>
  <rect x="6" y="6" width="308" height="144" fill="#160c14"/>
  <!-- 1979 Sunset Trim -->
  <rect x="6" y="6" width="308" height="2" fill="#ff7f2a"/>
  <rect x="6" y="8" width="308" height="2" fill="#ff6cb5"/>
  <rect x="6" y="10" width="308" height="2" fill="#a6ff38"/>
  <!-- Corner Rivets -->
  <rect x="4" y="4" width="2" height="2" fill="#ffdf9e"/>
  <rect x="314" y="4" width="2" height="2" fill="#ffdf9e"/>
  <rect x="4" y="150" width="2" height="2" fill="#ffdf9e"/>
  <rect x="314" y="150" width="2" height="2" fill="#ffdf9e"/>

  <!-- Header -->
  <text x="160" y="23" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="7.5" fill="#a6ff38" letter-spacing="1">KEYBOARD CONTROLS</text>

  <!-- ========================================================= -->
  <!-- ACTUAL 16-BIT PIXEL-ART RETRO KEYBOARD (Center: x=54..266, y=46..118) -->
  <!-- ========================================================= -->
  <!-- Keyboard Outer Shadow & Chassis -->
  <rect x="52" y="46" width="216" height="72" fill="#090407"/>
  <rect x="54" y="48" width="212" height="68" fill="#6b3e26"/>
  <rect x="56" y="50" width="208" height="2" fill="#9e623f"/>
  <rect x="56" y="112" width="208" height="4" fill="#3a1f12"/>
  <!-- Recessed Key Well -->
  <rect x="58" y="53" width="204" height="58" fill="#211210"/>

  <!-- Row 1 (QWERTY): Q [W] E R T Y U I O P -->
  <!-- Decorative non-active keys -->
  <rect x="62" y="56" width="14" height="12" fill="#3a231c"/><rect x="63" y="57" width="12" height="9" fill="#4f3228"/>
  <!-- ACTIVE [W] KEY (Lime) -->
  <rect x="78" y="56" width="14" height="12" fill="#10080a"/>
  <rect x="79" y="57" width="12" height="10" fill="#a6ff38"/>
  <rect x="80" y="58" width="10" height="7" fill="#1f3610"/>
  <text x="85" y="64" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="5.5" fill="#a6ff38">W</text>
  <!-- Rest of Row 1 -->
  <rect x="94" y="56" width="14" height="12" fill="#3a231c"/><rect x="95" y="57" width="12" height="9" fill="#4f3228"/>
  <rect x="110" y="56" width="14" height="12" fill="#3a231c"/><rect x="111" y="57" width="12" height="9" fill="#4f3228"/>
  <rect x="126" y="56" width="14" height="12" fill="#3a231c"/><rect x="127" y="57" width="12" height="9" fill="#4f3228"/>
  <rect x="142" y="56" width="14" height="12" fill="#3a231c"/><rect x="143" y="57" width="12" height="9" fill="#4f3228"/>
  <rect x="158" y="56" width="14" height="12" fill="#3a231c"/><rect x="159" y="57" width="12" height="9" fill="#4f3228"/>
  <rect x="174" y="56" width="14" height="12" fill="#3a231c"/><rect x="175" y="57" width="12" height="9" fill="#4f3228"/>
  <rect x="190" y="56" width="14" height="12" fill="#3a231c"/><rect x="191" y="57" width="12" height="9" fill="#4f3228"/>
  <rect x="206" y="56" width="14" height="12" fill="#3a231c"/><rect x="207" y="57" width="12" height="9" fill="#4f3228"/>
  <rect x="222" y="56" width="14" height="12" fill="#3a231c"/><rect x="223" y="57" width="12" height="9" fill="#4f3228"/>
  <rect x="238" y="56" width="20" height="12" fill="#3a231c"/><rect x="239" y="57" width="18" height="9" fill="#4f3228"/>

  <!-- Row 2 (ASDFGHJKL): [A] [S] [D] F G H [J] K L -->
  <!-- ACTIVE [A] KEY (Orange) -->
  <rect x="66" y="70" width="14" height="12" fill="#10080a"/>
  <rect x="67" y="71" width="12" height="10" fill="#ff7f2a"/>
  <rect x="68" y="72" width="10" height="7" fill="#3a1c0a"/>
  <text x="73" y="78" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="5.5" fill="#ffd9a8">A</text>
  <!-- ACTIVE [S] KEY (Pink) -->
  <rect x="82" y="70" width="14" height="12" fill="#10080a"/>
  <rect x="83" y="71" width="12" height="10" fill="#ff6cb5"/>
  <rect x="84" y="72" width="10" height="7" fill="#381228"/>
  <text x="89" y="78" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="5.5" fill="#ffb8dc">S</text>
  <!-- ACTIVE [D] KEY (Orange) -->
  <rect x="98" y="70" width="14" height="12" fill="#10080a"/>
  <rect x="99" y="71" width="12" height="10" fill="#ff7f2a"/>
  <rect x="100" y="72" width="10" height="7" fill="#3a1c0a"/>
  <text x="105" y="78" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="5.5" fill="#ffd9a8">D</text>
  <!-- F, G, H -->
  <rect x="114" y="70" width="14" height="12" fill="#3a231c"/><rect x="115" y="71" width="12" height="9" fill="#4f3228"/>
  <rect x="130" y="70" width="14" height="12" fill="#3a231c"/><rect x="131" y="71" width="12" height="9" fill="#4f3228"/>
  <rect x="146" y="70" width="14" height="12" fill="#3a231c"/><rect x="147" y="71" width="12" height="9" fill="#4f3228"/>
  <!-- ACTIVE [J] KEY (Pink Shoot) -->
  <rect x="162" y="70" width="14" height="12" fill="#10080a"/>
  <rect x="163" y="71" width="12" height="10" fill="#ff6cb5"/>
  <rect x="164" y="72" width="10" height="7" fill="#381228"/>
  <text x="169" y="78" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="5.5" fill="#ffb8dc">J</text>
  <!-- K, L, Enter -->
  <rect x="178" y="70" width="14" height="12" fill="#3a231c"/><rect x="179" y="71" width="12" height="9" fill="#4f3228"/>
  <rect x="194" y="70" width="14" height="12" fill="#3a231c"/><rect x="195" y="71" width="12" height="9" fill="#4f3228"/>
  <rect x="210" y="70" width="14" height="12" fill="#3a231c"/><rect x="211" y="71" width="12" height="9" fill="#4f3228"/>
  <rect x="226" y="70" width="32" height="12" fill="#3a231c"/><rect x="227" y="71" width="30" height="9" fill="#4f3228"/>

  <!-- Row 3 ([SHIFT] Z X C V [B] N M) -->
  <!-- ACTIVE [SHIFT] KEY (Gold/Brown) -->
  <rect x="62" y="84" width="28" height="12" fill="#10080a"/>
  <rect x="63" y="85" width="26" height="10" fill="#ffdf9e"/>
  <rect x="64" y="86" width="24" height="7" fill="#3a2410"/>
  <text x="76" y="92" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="4.4" fill="#ffdf9e">SHF</text>
  <!-- Z, X, C, V -->
  <rect x="92" y="84" width="14" height="12" fill="#3a231c"/><rect x="93" y="85" width="12" height="9" fill="#4f3228"/>
  <rect x="108" y="84" width="14" height="12" fill="#3a231c"/><rect x="109" y="85" width="12" height="9" fill="#4f3228"/>
  <rect x="124" y="84" width="14" height="12" fill="#3a231c"/><rect x="125" y="85" width="12" height="9" fill="#4f3228"/>
  <!-- ACTIVE [B] KEY (Lime Shield) -->
  <rect x="140" y="84" width="14" height="12" fill="#10080a"/>
  <rect x="141" y="85" width="12" height="10" fill="#a6ff38"/>
  <rect x="142" y="86" width="10" height="7" fill="#193310"/>
  <text x="147" y="92" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="5.5" fill="#a6ff38">B</text>
  <!-- N, M, Right Shift -->
  <rect x="156" y="84" width="14" height="12" fill="#3a231c"/><rect x="157" y="85" width="12" height="9" fill="#4f3228"/>
  <rect x="172" y="84" width="14" height="12" fill="#3a231c"/><rect x="173" y="85" width="12" height="9" fill="#4f3228"/>
  <rect x="188" y="84" width="14" height="12" fill="#3a231c"/><rect x="189" y="85" width="12" height="9" fill="#4f3228"/>
  <rect x="204" y="84" width="14" height="12" fill="#3a231c"/><rect x="205" y="85" width="12" height="9" fill="#4f3228"/>
  <rect x="220" y="84" width="38" height="12" fill="#3a231c"/><rect x="221" y="85" width="36" height="9" fill="#4f3228"/>

  <!-- Row 4 (Bottom: CTRL ALT [SPACEBAR] ALT ARROWS) -->
  <rect x="62" y="98" width="22" height="11" fill="#3a231c"/><rect x="63" y="99" width="20" height="8" fill="#4f3228"/>
  <rect x="86" y="98" width="16" height="11" fill="#3a231c"/><rect x="87" y="99" width="14" height="8" fill="#4f3228"/>
  <!-- ACTIVE [SPACE] BAR (Orange Jetpack) -->
  <rect x="104" y="98" width="82" height="11" fill="#10080a"/>
  <rect x="105" y="99" width="80" height="9" fill="#ff7f2a"/>
  <rect x="106" y="100" width="78" height="6" fill="#381808"/>
  <text x="145" y="105" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="4.8" fill="#ffd9a8">SPACE</text>
  <!-- Right Alt & Arrow cluster -->
  <rect x="188" y="98" width="18" height="11" fill="#3a231c"/><rect x="189" y="99" width="16" height="8" fill="#4f3228"/>
  <rect x="210" y="98" width="14" height="11" fill="#3a231c"/><rect x="211" y="99" width="12" height="8" fill="#4f3228"/>
  <rect x="226" y="98" width="14" height="11" fill="#3a231c"/><rect x="227" y="99" width="12" height="8" fill="#4f3228"/>
  <rect x="242" y="98" width="16" height="11" fill="#3a231c"/><rect x="243" y="99" width="14" height="8" fill="#4f3228"/>

  <!-- ========================================================= -->
  <!-- PIXEL-ART DIAGRAM CALLOUT LINES + LABELS                  -->
  <!-- ========================================================= -->

  <!-- 1. [W] -> JUMP 2X (Top-Left) -->
  <rect x="84" y="34" width="2" height="22" fill="#a6ff38"/>
  <rect x="64" y="34" width="22" height="2" fill="#a6ff38"/>
  <rect x="83" y="55" width="4" height="3" fill="#ffffff"/>
  <text x="60" y="38" text-anchor="end" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#a6ff38">JUMP 2X</text>

  <!-- 2. [A/D] -> MOVE (Mid-Left) -->
  <rect x="38" y="75" width="28" height="2" fill="#ff7f2a"/>
  <rect x="65" y="74" width="3" height="4" fill="#ffffff"/>
  <text x="35" y="79" text-anchor="end" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#ff9e44">MOVE</text>

  <!-- 3. [SHIFT] -> SPRINT (Lower-Left) -->
  <rect x="44" y="89" width="18" height="2" fill="#ffdf9e"/>
  <rect x="61" y="88" width="3" height="4" fill="#ffffff"/>
  <text x="41" y="93" text-anchor="end" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#ffdf9e">SPRINT</text>

  <!-- 4. [S] -> SLIDE/DUCK (Bottom-Left) -->
  <rect x="88" y="82" width="2" height="50" fill="#ff6cb5"/>
  <rect x="68" y="130" width="22" height="2" fill="#ff6cb5"/>
  <rect x="87" y="80" width="4" height="3" fill="#ffffff"/>
  <text x="64" y="134" text-anchor="end" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#ff9ed0">SLIDE/DUCK</text>

  <!-- 5. [SPACE] -> JETPACK (Bottom-Center) -->
  <rect x="144" y="109" width="2" height="23" fill="#ff7f2a"/>
  <rect x="143" y="108" width="4" height="3" fill="#ffffff"/>
  <text x="145" y="143" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#ff9e44">JETPACK</text>

  <!-- 6. [B] -> SHIELD (Bottom-Right) -->
  <rect x="146" y="96" width="2" height="28" fill="#a6ff38"/>
  <rect x="146" y="122" width="76" height="2" fill="#a6ff38"/>
  <rect x="145" y="94" width="4" height="3" fill="#ffffff"/>
  <text x="226" y="126" text-anchor="start" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#a6ff38">SHIELD</text>

  <!-- 7. [J] -> SHOOT (Top-Right) -->
  <rect x="168" y="34" width="2" height="36" fill="#ff6cb5"/>
  <rect x="168" y="34" width="56" height="2" fill="#ff6cb5"/>
  <rect x="167" y="69" width="4" height="3" fill="#ffffff"/>
  <text x="228" y="38" text-anchor="start" font-family="'Share Tech Mono', monospace" font-size="9.5" font-weight="bold" fill="#ff6cb5">SHOOT (J/CLK)</text>
</svg>
